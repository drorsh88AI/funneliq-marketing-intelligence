# Keeps the free-tier Supabase project from auto-pausing (~7 days idle).
# A 42501 "permission denied" ping (anon, no grants) did NOT count as activity
# -- the project paused anyway (Nov 2026). So: sign in as the demo user and run
# a real, successful read-only SELECT under RLS. No grants opened, nothing written.
name: supabase-keepalive

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC: one missed/delayed run is harmless
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sign in and query Postgres via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          DEMO_EMAIL: demo-northbound@funneliq.example.com
          DEMO_PASSWORD: ${{ secrets.SUPABASE_DEMO_PASSWORD }}
        run: |
          token=$(jq -n --arg e "$DEMO_EMAIL" --arg p "$DEMO_PASSWORD" '{email:$e,password:$p}' \
            | curl -sSf --max-time 30 "$SUPABASE_URL/auth/v1/token?grant_type=password" \
                -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d @- \
            | jq -r .access_token)
          echo "::add-mask::$token"
          # -f: any non-2xx (paused project, bad password, 5xx) fails the run -> GitHub emails.
          curl -sSf --max-time 30 -o /dev/null -w "HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/funnel_records?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $token"

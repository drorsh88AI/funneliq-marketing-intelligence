[pytest]
# Phase 11 checkpoint 10, extended phase 12 checkpoint 1. Restricts
# default collection (`pytest`, `python -m pytest -q`, no path argument
# -- exactly what CI's own ci.yml runs) to tests/ only. Isolates e2e/
# (phase 11, Playwright-based mocked browser tests) and live/ (phase 12,
# real credentials against the deployed service -- P12-D3) from ever
# being auto-collected: without this, a bare `pytest -q` would try to
# import every e2e/*.py and live/*.py file at collection time and crash
# with ModuleNotFoundError the moment Playwright is referenced, in any
# environment (including this CI job) that never installed it -- and,
# for live/ specifically, would risk a getpass prompt or a rejected
# opt-in check running somewhere no human is present to answer it.
testpaths = tests

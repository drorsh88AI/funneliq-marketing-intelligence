[pytest]
# Phase 11 checkpoint 10. Restricts default collection (`pytest`,
# `python -m pytest -q`, no path argument -- exactly what CI's own
# ci.yml runs) to tests/ only. Isolates the future e2e/ directory
# (checkpoint 11 -- Playwright-based, its own requirements-e2e.txt)
# from ever being auto-collected: without this, a bare `pytest -q`
# would try to import every e2e/*.py file at collection time and crash
# with ModuleNotFoundError the moment Playwright is referenced, in any
# environment (including this CI job) that never installed it.
testpaths = tests
